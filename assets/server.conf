# N.O.V.A. 3 connection settings. Restart the game after editing.
# Start the dedicated server separately; the client never starts or stops it.
mode = offline

# Set mode = online and choose one dedicated server (hostname or IPv4).
# The game retains its original service discovery and request URLs.
# address = server.example.org
# Same PC: address = 127.1.1.1
# Hostname: automatic Windows certificate and hostname validation.
# Literal IPv4: certificate verification disabled for that destination only.
# No certificate files, catalogue or separate price settings are needed here.

# Optional existing profile. Relative paths start from this file; use UTF-8.
# Omit to retain your habitual player profile.
# profile_root = local/profiles/player

# The dedicated server uses port 18443 for both TCP and UDP.
# Allow/forward both protocols on that port when hosting on a LAN or Internet.

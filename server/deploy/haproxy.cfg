# TLS termination for nova-server --proxy-domain game.example.org.
# Run HAProxy and nova-server on the same host/network namespace.
# game.pem contains the domain certificate chain and private key.
# UDP 18443 must reach nova-server directly; it is not HTTP or TLS traffic.
global
    maxconn 1024

defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m

frontend nova_services
    bind :18443 ssl crt /etc/haproxy/certs/game.pem ssl-min-ver TLSv1.2
    default_backend nova_services_local

backend nova_services_local
    server nova 127.0.0.1:18080
